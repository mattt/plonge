names = [".astro", ".build", ".gradle", ".mypy_cache", ".next", ".parcel-cache",
         ".pytest_cache", ".ruff_cache", ".svelte-kit", ".turbo", ".venv",
         "DerivedData", "__pycache__", "dist", "node_modules", "target", "venv"]
quiet_hours = 24

# Do not scan inside these directories.
skip = [".cache", ".git", ".hg", ".jj", ".svn"]

# Match these names only when a listed project file is in the same directory.
[beside]
dist = ["package.json"]
target = ["Cargo.toml", "pom.xml"]
venv = ["pyproject.toml", "requirements.txt", "setup.py"]

# Global caches. Each command starts with the tool and runs without a shell.
# prune uses the tool's policy to select unused or stale data.
# clear can remove cached data still in use and requires --include-clear.

# This fixed path assumes mise's default installs directory.
# Override this rule in rules.toml if mise uses a different directory.
# A tracked config that mise cannot load does not protect its tool versions,
# so a prune can remove a version that a project needs.
# mise prints the load warnings only at the info log level or lower,
# so the check sets that level even when the user turns the warnings off.
[[global]]
id = "mise-tools"
tool = "mise"
path = "~/.local/share/mise/installs"
clean = "mise prune --tools --yes"
kind = "prune"
check = "mise prune --tools --dry-run"
check_env = ["MISE_QUIET=0", "MISE_LOG_LEVEL=info"]
refuse = 'error loading tracked config file (?P<path>.+)$'
refuse_reason = "tracked configs that mise cannot load"
targets = "mise ls --prunable --json"

[[global]]
id = "mise-cache"
tool = "mise"
path = "mise cache path"
clean = "mise cache prune"
kind = "prune"

[[global]]
id = "uv"
tool = "uv"
path = "uv cache dir"
clean = "uv cache prune"
kind = "prune"

[[global]]
id = "go-modules"
tool = "go"
path = "go env GOMODCACHE"
clean = "go clean -modcache"
kind = "clear"

[[global]]
id = "go-build"
tool = "go"
path = "go env GOCACHE"
clean = "go clean -cache"
kind = "clear"

[[global]]
id = "npm"
tool = "npm"
path = "npm config get cache"
clean = "npm cache clean --force"
kind = "clear"

[[global]]
id = "pnpm"
tool = "pnpm"
path = "pnpm store path"
clean = "pnpm store prune"
kind = "prune"

# Yarn 1 only. Yarn 2 and later do not provide "yarn cache dir".
[[global]]
id = "yarn"
tool = "yarn"
path = "yarn cache dir"
clean = "yarn cache clean"
kind = "clear"

[[global]]
id = "pip"
tool = "pip"
path = "pip cache dir"
clean = "pip cache purge"
kind = "clear"

[[global]]
id = "homebrew"
tool = "brew"
path = "brew --cache"
clean = "brew cleanup --prune=all"
kind = "clear"

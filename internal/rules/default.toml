names = [".astro", ".build", ".gradle", ".mypy_cache", ".next", ".nox",
         ".parcel-cache", ".pytest_cache", ".ruff_cache", ".svelte-kit", ".tox",
         ".turbo", ".venv", ".zig-cache", "DerivedData", "__pycache__", "_build",
         "bin", "build", "dist", "node_modules", "obj", "target", "tmp/cache",
         "vendor/bundle", "venv", "zig-cache"]
quiet_hours = 24

# .build and DerivedData beside Package.swift hold the dependency clones
# that Swift Package Manager manages. Plonge lets through a clone that SwiftPM
# can make again and refuses any other Git repository in them.

# Do not scan inside these directories.
skip = [".cache", ".git", ".hg", ".jj", ".svn"]

# Match these names only when a listed project file is in the same directory.
# A project file can be a pattern, such as "*.csproj".
# For a path name, such as "vendor/bundle", the project file is beside
# the first name in the path.
# Zig 0.13 renamed the local cache from zig-cache to .zig-cache.
# zig-out is left out: it is install output, not a cache, and can hold
# programs and libraries that a user runs or links from.
# Gradle puts a project's output in build beside its build or settings file.
# setuptools uses build beside pyproject.toml or setup.py.
# Mix puts build output in _build. Mix keeps dependency sources in deps,
# which is left out because an edited Hex package there has no Git data
# that plonge can check. Rebar3 also uses _build, but it puts dependency
# sources in _build/<profile>/lib, so _build beside rebar.config is left out,
# and a _build that holds dependency sources is refused.
# Bundler installs gems in vendor/bundle beside the Gemfile (or gems.rb)
# when path is vendor/bundle or deployment is set; bundle install restores them.
# vendor/cache is left out: bundle cache puts gems there on purpose,
# for installs without a network, and a gem from a source that is gone
# cannot be downloaded again.
# Rails keeps its default cache store in tmp/cache, as bootsnap does its cache,
# and Rails finds its root by config.ru. The rest of tmp is left out: it holds
# pid files, sockets, and in development the local secret key base.
[beside]
".zig-cache" = ["build.zig"]
_build = ["mix.exs"]
bin = ["*.csproj", "*.fsproj", "*.vbproj"]
build = ["build.gradle", "build.gradle.kts", "pyproject.toml", "settings.gradle",
         "settings.gradle.kts", "setup.py"]
dist = ["package.json", "pyproject.toml", "setup.py"]
obj = ["*.csproj", "*.fsproj", "*.vbproj"]
target = ["Cargo.toml", "pom.xml"]
"tmp/cache" = ["config.ru"]
"vendor/bundle" = ["Gemfile", "gems.rb"]
venv = ["pyproject.toml", "requirements.txt", "setup.py"]
zig-cache = ["build.zig"]

# Refuse a match that has an entry at one of these paths, relative to it.
# A release that Mix or Rebar3 builds goes in _build/<env or profile>/rel.
# It can hold a generated Erlang cookie and the earlier versions that an
# upgrade needs, which a new build does not restore.
# A Rebar3 build puts dependency sources in _build/<profile>/lib/<dep>/src,
# where an edit has no Git data that plonge can check.
[refuse_inside]
_build = ["*/rel", "*/lib/*/src"]

# Global caches. Each command starts with the tool and runs without a shell.
# prune uses the tool's policy to select unused or stale data.
# clear can remove cached data still in use and requires --include-clear.
# For a cache with no cleanup command, delete_contents = true replaces clean:
# plonge deletes what is in path and keeps the directory. It needs kind clear,
# and plonge refuses a path that is not absolute; is /, the home directory,
# or contains it; is or resolves through a symlink; is in a Git repository
# or holds one at any depth, as a project cache can; or does not exist.

# Plonge measures the installs directory that mise uses:
# $MISE_INSTALLS_DIR, or installs in the data directory from "mise doctor --json".
# This path is used only when mise cannot report that directory.
# A tracked config that mise cannot load does not protect its tool versions,
# so a prune can remove a version that a project needs.
# mise prints the load warnings only at the info log level or lower,
# so the check sets that level even when the user turns the warnings off.
[[global]]
id = "mise-tools"
tool = "mise"
path = "~/.local/share/mise/installs"
clean = "mise prune --tools --yes"
kind = "prune"
check = "mise prune --tools --dry-run"
check_env = ["MISE_QUIET=0", "MISE_LOG_LEVEL=info"]
refuse = 'error loading tracked config file (?P<path>.+)$'
refuse_reason = "tracked configs that mise cannot load"
targets = "mise ls --prunable --json"

[[global]]
id = "mise-cache"
tool = "mise"
path = "mise cache path"
clean = "mise cache prune"
kind = "prune"

[[global]]
id = "uv"
tool = "uv"
path = "uv cache dir"
clean = "uv cache prune"
kind = "prune"

[[global]]
id = "go-modules"
tool = "go"
path = "go env GOMODCACHE"
clean = "go clean -modcache"
kind = "clear"

[[global]]
id = "go-build"
tool = "go"
path = "go env GOCACHE"
clean = "go clean -cache"
kind = "clear"

# Cargo 1.88 and later delete global cache files that they have not used
# for 1 to 3 months, as cache.auto-clean-frequency sets. The cargo clean gc
# command that cleans on request is unstable, so plonge deletes the contents
# of registry in the Cargo home: $CARGO_HOME, or ~/.cargo when it is
# not set; path_subdir joins registry to either one.
# Cargo has no stable command that prints the Cargo home.
# registry holds the crate index, downloaded .crate files, and their sources,
# which a later build downloads again.
# git is left out: its checkouts are working trees, and an edit there is lost.
# The rule leaves out bin, config.toml, credentials.toml, and the records of
# cargo install in the Cargo home.
[[global]]
id = "cargo-registry"
tool = "cargo"
path = "~/.cargo"
path_env = "CARGO_HOME"
path_subdir = "registry"
delete_contents = true
kind = "clear"

[[global]]
id = "npm"
tool = "npm"
path = "npm config get cache"
clean = "npm cache clean --force"
kind = "clear"

[[global]]
id = "pnpm"
tool = "pnpm"
path = "pnpm store path"
clean = "pnpm store prune"
kind = "prune"

# bun pm cache prune removes package folders that are more than 30 days old.
# Where the file system does not record access times, as on macOS,
# the age is the time since download, so it can remove packages in use: clear.
# It keeps the global store in links/, which bun pm cache rm deletes.
# Bun added the command in 1.4.4, so the check needs exactly one version line
# and refuses older versions.
[[global]]
id = "bun"
tool = "bun"
path = "bun pm cache"
clean = "bun pm cache prune"
kind = "clear"
check = "bun --version"
require = '^[0-9]+\.[0-9]+\.[0-9]+'
refuse = '^(0\.|1\.[0-3]\.|1\.4\.[0-3]([^0-9]|$))'
refuse_reason = "Bun before 1.4.4 has no cache prune command"

# deno clean deletes all of DENO_DIR, which also holds user state:
# localStorage and Cache API data in location_data, and the REPL history.
# These rules delete only the caches that deno info --json names.
[[global]]
id = "deno-remote"
tool = "deno"
path = "deno info --json"
path_field = "modulesCache"
delete_contents = true
kind = "clear"

[[global]]
id = "deno-npm"
tool = "deno"
path = "deno info --json"
path_field = "npmCache"
delete_contents = true
kind = "clear"

[[global]]
id = "deno-gen"
tool = "deno"
path = "deno info --json"
path_field = "typescriptCache"
delete_contents = true
kind = "clear"

# The yarn and yarn-berry rules run the same yarn. Each one requires
# yarn --version to print exactly one version line, and refuses the versions
# that the other rule accepts, so at most one of them runs.

# Yarn 1 only. Yarn 2 and later do not provide "yarn cache dir".
[[global]]
id = "yarn"
tool = "yarn"
path = "yarn cache dir"
clean = "yarn cache clean"
kind = "clear"
check = "yarn --version"
require = '^[0-9]+\.[0-9]+\.[0-9]+'
refuse = '^(0|[2-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+'
refuse_reason = "yarn --version did not report Yarn 1"

# Yarn 2 and later. yarn cache clean deletes cacheFolder.
# Only with enableGlobalCache is cacheFolder the global cache.
# Without it, cacheFolder is a project's .yarn/cache, which a project
# with zero-installs keeps in Git, and a command rule has no Git check.
# So the second check requires enableGlobalCache to be true,
# and skips the rule when Yarn does not report the setting.
[[global]]
id = "yarn-berry"
tool = "yarn"
path = "yarn config get cacheFolder"
clean = "yarn cache clean"
kind = "clear"
check = "yarn --version"
require = '^[0-9]+\.[0-9]+\.[0-9]+'
refuse = '^[01]\.[0-9]+\.[0-9]+'
refuse_reason = "yarn --version did not report Yarn 2 or later"

[[global.checks]]
check = "yarn config get enableGlobalCache"
require = '^true$'

[[global]]
id = "pip"
tool = "pip"
path = "pip cache dir"
clean = "pip cache purge"
kind = "clear"

[[global]]
id = "homebrew"
tool = "brew"
path = "brew --cache"
clean = "brew cleanup --prune=all"
kind = "clear"

# NuGet prints "global-packages: <path>"; the examples in Microsoft's
# documentation also show "info : " before it, so path_label selects the path.
# Clearing removes every package, including ones that projects use;
# dotnet restore downloads them again.
[[global]]
id = "nuget-packages"
tool = "dotnet"
path = "dotnet nuget locals global-packages --list"
path_label = "global-packages"
clean = "dotnet nuget locals global-packages --clear"
kind = "clear"

[[global]]
id = "nuget-http-cache"
tool = "dotnet"
path = "dotnet nuget locals http-cache --list"
path_label = "http-cache"
clean = "dotnet nuget locals http-cache --clear"
kind = "clear"

# Swift Package Manager keeps one shared cache per user, in the user's caches
# directory, and prints no command for its path. --cache-path is the only
# setting that moves it, so these rules use the default for each system
# and pass it as --cache-path, so the command cleans the cache that plonge measures.
# On Linux, Foundation puts SwiftPM's own default in $XDG_CACHE_HOME when set;
# that cache is not covered.
# purge-cache removes the cached Git repositories, registry downloads, and
# manifest cache, including ones that projects use, so the rules are clear.
# It keeps the artifacts and prebuilts folders, which plonge still measures.
# Run outside a package, purge-cache writes CACHEDIR.TAG and a build-system
# file to <working directory>/.build. Plonge runs it from the home directory,
# so --scratch-path, relative to home, puts them in the cache directory
# instead of making ~/.build.
[[global]]
id = "swiftpm-macos"
tool = "swift"
path = "~/Library/Caches/org.swift.swiftpm"
clean = "swift package purge-cache --cache-path Library/Caches/org.swift.swiftpm --scratch-path Library/Caches/org.swift.swiftpm"
kind = "clear"
os = "darwin"

[[global]]
id = "swiftpm-linux"
tool = "swift"
path = "~/.cache/org.swift.swiftpm"
clean = "swift package purge-cache --cache-path .cache/org.swift.swiftpm --scratch-path .cache/org.swift.swiftpm"
kind = "clear"
os = "linux"

# Zig has no command that cleans its global cache, so plonge deletes its
# contents. The cache holds build output and the packages that zig fetch and
# zig build download; a later build downloads a package again.
# zig env prints ZON, with a path inside the home directory relative to it,
# and it creates the cache directory if it does not exist.
[[global]]
id = "zig-global-cache"
tool = "zig"
path = "zig env"
path_zon_field = "global_cache_dir"
delete_contents = true
kind = "clear"

# Hex has no command that cleans its package cache, and it prints no path
# for the packages folder, so this rule uses Hex's default, ~/.hex/packages.
# HEX_HOME and MIX_XDG move it; that cache is not covered.
# ~/.hex also holds hex.config, with the user's Hex API key, and the
# registry cache, so the rule deletes only the contents of packages.
# The folder holds package tarballs; a later mix deps.get downloads them again,
# and HEX_OFFLINE cannot use the ones that were deleted.
[[global]]
id = "hex-packages"
tool = "mix"
path = "~/.hex/packages"
delete_contents = true
kind = "clear"

# Rebar3 has no command that cleans its package cache or prints its path.
# The hex folder of its global cache holds the package index and tarballs.
# REBAR_CACHE_DIR moves the global cache; that cache is not covered.
# The global cache also holds the rebar3 that "rebar3 local install" makes,
# under bin and vsns, and global plugins, so the rule deletes only hex.
[[global]]
id = "rebar3-hex"
tool = "rebar3"
path = "~/.cache/rebar3/hex"
delete_contents = true
kind = "clear"

# Gradle has no command that cleans the caches in its user home, and none that
# prints the user home, which is $GRADLE_USER_HOME, or ~/.gradle when it is
# not set. Gradle deletes unused cache entries on its own when a daemon stops.
# caches holds downloaded dependencies, transforms, the local build cache,
# and the caches of each Gradle version, which later builds make again.
# It also holds user-id.txt, an ID that Gradle writes again when it is missing.
# The rule leaves out gradle.properties, which can hold credentials, init.d,
# wrapper/dists, jdks, daemon, and native in the user home.
# Many projects run Gradle only through gradlew, with no gradle on PATH,
# so the rule needs java, which every Gradle build runs on.
[[global]]
id = "gradle-caches"
tool = "java"
path = "~/.gradle"
path_env = "GRADLE_USER_HOME"
path_subdir = "caches"
delete_contents = true
kind = "clear"

# Maven has no command that cleans its local repository, and none that prints
# its path without a plugin that it may have to download. The path can be set
# in settings.xml, by maven.repo.local in MAVEN_OPTS, MAVEN_ARGS, or a
# project's .mvn/maven.config, and, in Maven 4, in properties files,
# so this rule uses Maven's default, ~/.m2/repository.
# A moved repository is not covered.
# The rule leaves out settings.xml, settings-security.xml, toolchains.xml,
# and extensions.xml in ~/.m2.
# mvn install and install:install-file put artifacts in the repository that
# no remote repository may hold, and write maven-metadata-local.xml for them.
# A download never writes that file, so the rule refuses a repository
# that holds one.
# Many projects run Maven only through mvnw, with no mvn on PATH,
# so the rule needs java, which every Maven build runs on.
[[global]]
id = "maven-repository"
tool = "java"
path = "~/.m2/repository"
delete_contents = true
kind = "clear"
refuse_names = ["maven-metadata-local.xml"]

# RubyGems keeps a copy of each .gem file that it installs in the cache
# directory of the gem directory, and has no command that removes the copies.
# gem cleanup is a different action: it uninstalls old gem versions, which a
# project's Gemfile.lock can still need, so plonge does not run it.
# gem pristine downloads a missing copy again. bundle cache copies from this
# directory and, without --all-platforms, fails for a gem whose copy is gone.
# gem env gemdir prints the gem directory of one Ruby, the one that gem runs
# from the home directory; other Ruby versions keep their own caches.
# Bundler keeps a bare clone of each gem's Git source in cache/bundler/git.
# A clone can hold commits that its remote no longer has,
# and bundle clean removes the clones that the current bundle does not use,
# so the rule keeps cache/bundler. Any other Git repository in the cache
# still refuses the rule.
[[global]]
id = "rubygems-cache"
tool = "gem"
path = "gem env gemdir"
path_subdir = "cache"
delete_contents = true
keep_names = ["bundler"]
kind = "clear"
